<!DOCTYPE html>
<html>
<head>

<title>Research Dashboard Login</title>

<style>

body{
margin:0;
padding:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;

background: linear-gradient(135deg,#667eea,#764ba2,#ff758c,#ff7eb3);
background-size:400% 400%;
animation:bgmove 10s infinite alternate;
}

@keyframes bgmove{
0%{background-position:left}
100%{background-position:right}
}

.login-box{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:15px;
backdrop-filter:blur(10px);
width:320px;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

.login-box h2{
color:white;
margin-bottom:20px;
}

.input-box{
margin:15px 0;
}

.input-box input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:linear-gradient(45deg,#ff512f,#dd2476);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.footer{
margin-top:15px;
color:white;
font-size:12px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Covid Research Dashboard</h2>

<div class="input-box">
<input id="username" placeholder="Username">
</div>

<div class="input-box">
<input id="password" type="password" placeholder="Password">
</div>

<button onclick="login()">Login</button>

<div class="footer">
Research Analytics System
</div>

</div>

<script>

async function login(){

const username=document.getElementById("username").value
const password=document.getElementById("password").value

await fetch("/auth/login",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username,password})

})

window.location="dashboard.html"

}

</script>

</body>
</html>
