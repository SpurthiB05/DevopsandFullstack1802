<!DOCTYPE html>
<html>
<head>

<title>Covid Research Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f7ff;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#667eea,#764ba2,#ff758c);
padding:20px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
margin:0;
}

.logout{
background:white;
color:#764ba2;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* DASHBOARD LAYOUT */

.container{
padding:30px;
}

/* CARDS */

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.card{
flex:1;
min-width:200px;
padding:20px;
border-radius:12px;
color:white;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.card1{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.card2{
background:linear-gradient(135deg,#a18cd1,#fbc2eb);
}

.card3{
background:linear-gradient(135deg,#84fab0,#8fd3f4);
}

.card h3{
margin:0;
font-size:18px;
}

.card p{
font-size:28px;
margin-top:10px;
}

/* CHART BOX */

.chart-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="header">

<h2>Covid Research Dashboard</h2>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="container">

<!-- STATS CARDS -->

<div class="cards">

<div class="card card1">
<h3>Countries</h3>
<p>5</p>
</div>

<div class="card card2">
<h3>Regression Models</h3>
<p>5</p>
</div>

<div class="card card3">
<h3>Dataset Period</h3>
<p>2020-2022</p>
</div>

</div>

<!-- CHART -->

<div class="chart-box">

<h3>Regression Model Performance</h3>

<canvas id="chart"></canvas>

</div>

</div>

<script>

async function loadData(){

const res = await fetch("/data/all")
const data = await res.json()

const labels = data.map(d => d.model)
const correlation = data.map(d => d.correlation)

new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Correlation Score",
data:correlation,
backgroundColor:[
"#ff6b6b",
"#4ecdc4",
"#f7b733",
"#6a89cc",
"#b8e994"
]
}]
}

})

}

loadData()

function logout(){

fetch("/auth/logout")

window.location="login.html"

}

</script>

</body>
</html>
